name: Release

# 推送 v 开头的 tag（如 v1.0.0）时，交叉编译各平台并发布到 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all platforms
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # 每行：GOOS GOARCH 产物名后缀 额外环境变量
          targets="
          linux   amd64   linux-amd64
          linux   arm64   linux-arm64
          linux   arm     linux-armv7     GOARM=7
          linux   mipsle  router-mipsle   GOMIPS=softfloat
          linux   mips    router-mips     GOMIPS=softfloat
          darwin  amd64   darwin-amd64
          darwin  arm64   darwin-arm64
          windows amd64   windows-amd64
          windows arm64   windows-arm64
          "
          while read -r goos goarch name extra; do
            [ -z "${goos:-}" ] && continue
            bin="nettool"
            [ "$goos" = "windows" ] && bin="nettool.exe"
            workdir="dist/nettool-${VERSION}-${name}"
            mkdir -p "$workdir"
            echo "==> building $name"
            env GOOS="$goos" GOARCH="$goarch" ${extra:-IGNORE=1} \
              go build -trimpath -ldflags "-s -w" -o "$workdir/$bin" .
            cp README.md "$workdir/"
            cp -r deploy "$workdir/deploy"
            if [ "$goos" = "windows" ]; then
              (cd dist && zip -qr "nettool-${VERSION}-${name}.zip" "nettool-${VERSION}-${name}")
            else
              (cd dist && tar -czf "nettool-${VERSION}-${name}.tar.gz" "nettool-${VERSION}-${name}")
            fi
            rm -rf "$workdir"
          done <<< "$targets"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            dist/*
